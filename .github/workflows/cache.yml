name: Refresh PHP cache

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the cache assets in the builds release and Cloudsmith
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: refresh-php-cache
  cancel-in-progress: false

jobs:
  runtime:
    name: Package x86_64 runtime on arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check arm64 runner and Rosetta
        run: |
          test "$(uname -m)" = "arm64"
          /usr/bin/arch -x86_64 /usr/bin/true
          test -x /usr/bin/perl
          test -x /usr/bin/m4
          sw_vers

      - name: Prepare PHP build root
        run: |
          backup="/opt/local.before-cache-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime"
          state="$RUNNER_TEMP/opt-local-runtime-state"
          test ! -e "$backup"
          if [[ -d /opt/local ]]; then
            sudo mv /opt/local "$backup"
            echo present > "$state"
          else
            echo absent > "$state"
          fi
          source_cache="$RUNNER_TEMP/php55-cache-current.tar.zst"
          curl -fsSL --retry 3 -o "$source_cache" "https://github.com/$GITHUB_REPOSITORY/releases/download/builds/php55-cache.tar.zst"
          zstd -dc "$source_cache" | sudo tar -xf - -C /
          command -v pkg-config || brew install pkgconf
          command -v cargo
          command -v rustup

      - name: Package compatible runtime libraries
        run: |
          runtime_dir="$RUNNER_TEMP/php-runtime"
          mkdir -p "$runtime_dir"
          RUNTIME_WORK_DIR="$RUNNER_TEMP/runtime-work" \
            bash scripts/package-runtime.sh "$runtime_dir/php-runtime.tar.gz"
          (
            cd "$runtime_dir"
            shasum -a 256 php-runtime.tar.gz > SHA256SUMS
            tar -tzf php-runtime.tar.gz | sort > runtime-files.txt
          )
          cat "$runtime_dir/SHA256SUMS"
          cat "$runtime_dir/runtime-files.txt"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: php-runtime-arm64
          path: ${{ runner.temp }}/php-runtime
          if-no-files-found: error
          retention-days: 14

      - name: Restore runner state
        if: ${{ always() }}
        run: |
          backup="/opt/local.before-cache-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime"
          state="$RUNNER_TEMP/opt-local-runtime-state"
          [[ -f "$state" ]] || exit 0
          sudo rm -rf /opt/local
          if [[ "$(cat "$state")" == "present" ]]; then
            test -e "$backup"
            sudo mv "$backup" /opt/local
          fi

  build:
    name: PHP ${{ matrix.php-version }} on arm64
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php-version: ['53', '54', '55']
    env:
      PHP_VERSION: ${{ matrix.php-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download runtime
        uses: actions/download-artifact@v8
        with:
          name: php-runtime-arm64
          path: ${{ runner.temp }}/runtime

      - name: Refresh published cache and compare
        run: |
          test "$(uname -m)" = "arm64"
          /usr/bin/arch -x86_64 /usr/bin/true
          (
            cd "$RUNNER_TEMP/runtime"
            shasum -a 256 -c SHA256SUMS
          )
          source_cache="$RUNNER_TEMP/php${PHP_VERSION}-cache-current.tar.zst"
          curl -fsSL --retry 3 -o "$source_cache" "https://github.com/$GITHUB_REPOSITORY/releases/download/builds/php${PHP_VERSION}-cache.tar.zst"
          SOURCE_CACHE="$source_cache" \
            RUNTIME_ARCHIVE="$RUNNER_TEMP/runtime/php-runtime.tar.gz" \
            BUILD_DIR="$RUNNER_TEMP/builds" \
            REPORT_DIR="$RUNNER_TEMP/comparison" \
            PREINSTALLED_DIR="/opt/local.before-cache-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP_VERSION}" \
            OPT_LOCAL_STATE_FILE="$RUNNER_TEMP/opt-local-build-state" \
            bash scripts/refresh-cache.sh "$PHP_VERSION"
          echo /opt/local/bin >> "$GITHUB_PATH"

      - name: Validate PHP, extensions, and dependency closure
        run: |
          php --ini
          php -v
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message" >&2
            exit 1
          fi
          sudo /opt/local/sbin/php-fpm"$PHP_VERSION" -t
          file "$(command -v php)" | grep -q x86_64
          ext_dir="$(php -i | sed -n 's|^extension_dir => \(/.*\) =>.*|\1|p' | head -1)"
          for bin in "$ext_dir"/*.so; do
            extension="$(basename "$bin" .so)"
            case "$extension" in
              opcache) extension='Zend OPcache' ;;
              xdebug) continue ;;
            esac
            php -r "if (!extension_loaded('$extension')) { throw new Exception('$extension not loaded'); }"
          done
          php -r '$image = imagecreatetruecolor(2, 2); if ($image === false) { throw new Exception("GD failed"); }'
          php -r 'if (gmp_strval(gmp_add("2", "3")) !== "5") { throw new Exception("GMP failed"); }'
          php -r '$db = new SQLite3(":memory:"); if ($db->querySingle("SELECT 2 + 3") !== 5) { throw new Exception("SQLite failed"); }'
          php -r '$file = tempnam(sys_get_temp_dir(), "zip"); unlink($file); $zip = new ZipArchive(); if ($zip->open($file, ZipArchive::CREATE) !== true || !$zip->addFromString("test", "ok") || !$zip->close()) { throw new Exception("ZIP failed"); } unlink($file);'
          php -r '$xml = new DOMDocument(); $xml->loadXML("<root/>"); $style = new DOMDocument(); $style->loadXML("<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"><xsl:template match=\"/\"><ok/></xsl:template></xsl:stylesheet>"); $xsl = new XSLTProcessor(); $xsl->importStylesheet($style); if (strpos($xsl->transformToXML($xml), "<ok/>") === false) { throw new Exception("XSL failed"); }'
          php -r 'if (extension_loaded("yaml")) { $parsed = yaml_parse("key: value"); if ($parsed["key"] !== "value") { throw new Exception("YAML failed"); } }'
          AUDIT_DIR="$RUNNER_TEMP/comparison/base-dependency-audit" bash scripts/audit-dependencies.sh

      - name: Validate curl and Composer 2.2
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
        run: |
          php -r 'if (!extension_loaded("curl")) { throw new Exception("curl extension not loaded"); }'
          ssl_version="$(php -r '$curl = curl_version(); echo $curl["ssl_version"];')"
          echo "curl SSL backend: $ssl_version"
          case "$ssl_version" in
            OpenSSL/*) ;;
            *) echo "Expected the OpenSSL curl backend" >&2; exit 1 ;;
          esac
          php -r '$curl = curl_init("https://repo.packagist.org/packages.json"); curl_setopt($curl, CURLOPT_RETURNTRANSFER, true); $body = curl_exec($curl); if ($body === false) { throw new Exception(curl_error($curl)); } if (curl_getinfo($curl, CURLINFO_HTTP_CODE) !== 200) { throw new Exception("Unexpected HTTP status"); }'
          composer="$RUNNER_TEMP/composer.phar"
          curl -fsSL --retry 3 -o "$composer" https://getcomposer.org/download/2.2.29/composer.phar
          echo "f38623ebdeeab5905b24b048fd32804150e598436cc43db9fc12362894c1279d  $composer" | shasum -a 256 -c -
          php "$composer" --version
          php "$composer" show --platform | tee "$RUNNER_TEMP/composer-platform.txt"
          grep -Eq '^lib-curl-openssl[[:space:]]' "$RUNNER_TEMP/composer-platform.txt"
          if grep -Eq '^lib-curl-[^[:space:]]*[()]' "$RUNNER_TEMP/composer-platform.txt"; then
            echo "Composer generated an invalid lib-curl package name" >&2
            exit 1
          fi
          php "$composer" global require --no-interaction --no-progress psr/log:1.1.4
          test -f "$COMPOSER_HOME/vendor/psr/log/Psr/Log/LoggerInterface.php"

      - name: Validate packaged PECL build tools
        run: |
          /opt/local/bin/autoconf --version | grep -q '2\.69'
          curl -fsSL --retry 3 -o /tmp/msgpack-0.5.7.tgz https://pecl.php.net/get/msgpack-0.5.7.tgz
          sudo env PATH="/opt/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            /opt/local/bin/pecl install /tmp/msgpack-0.5.7.tgz
          extension_dir="$(php -r 'echo ini_get("extension_dir");')"
          php -d "extension=$extension_dir/msgpack.so" -r 'if (!extension_loaded("msgpack")) { throw new Exception("msgpack not loaded"); }'
          file -L "$extension_dir/msgpack.so" | grep -q x86_64
          AUDIT_DIR="$RUNNER_TEMP/comparison/pecl-dependency-audit" bash scripts/audit-dependencies.sh

      - name: Validate published Imagick cache
        run: |
          bash scripts/install.sh "$PHP_VERSION" imagick
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message after installing Imagick" >&2
            exit 1
          fi
          php -r 'if (!extension_loaded("imagick")) { throw new Exception("imagick not loaded"); }'
          imagick_path="$(php -r 'echo ini_get("extension_dir") . "/imagick.so";')"
          test -f "$imagick_path"
          file -L "$imagick_path" | grep -q x86_64
          file -L /opt/local/bin/convert | grep -q x86_64
          php -r '$formats = Imagick::queryFormats("HEI*"); if (!in_array("HEIC", $formats, true) && !in_array("HEIF", $formats, true)) { throw new Exception("HEIC/HEIF support not found"); }'
          /opt/local/bin/convert -list format | grep -Eq '^[[:space:]]*HEI(C|F)'
          AUDIT_DIR="$RUNNER_TEMP/comparison/imagick-dependency-audit" bash scripts/audit-dependencies.sh

      - name: Upload cache comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: php${{ env.PHP_VERSION }}-comparison-arm64
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate cache
        uses: actions/upload-artifact@v7
        with:
          name: php${{ env.PHP_VERSION }}-cache-arm64
          path: ${{ runner.temp }}/builds/php${{ env.PHP_VERSION }}-cache.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Restore runner state
        if: ${{ always() }}
        run: |
          backup="/opt/local.before-cache-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP_VERSION}"
          state="$RUNNER_TEMP/opt-local-build-state"
          [[ -f "$state" ]] || exit 0
          sudo rm -rf /opt/local
          if [[ "$(cat "$state")" == "present" ]]; then
            test -e "$backup"
            sudo mv "$backup" /opt/local
          fi

  intel:
    name: PHP ${{ matrix.php-version }} native Intel compatibility
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ['53', '54', '55']
    env:
      PHP_VERSION: ${{ matrix.php-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare isolated Intel runner
        run: |
          test "$(uname -m)" = "x86_64"
          backup="/opt/local.before-intel-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP_VERSION}"
          state="$RUNNER_TEMP/opt-local-intel-state"
          test ! -e "$backup"
          if [[ -d /opt/local ]]; then
            sudo mv /opt/local "$backup"
            echo present > "$state"
          else
            echo absent > "$state"
          fi
          command -v zstd || brew install zstd
          sw_vers

      - name: Download arm64-produced candidate
        uses: actions/download-artifact@v8
        with:
          name: php${{ env.PHP_VERSION }}-cache-arm64
          path: ${{ runner.temp }}/candidate

      - name: Install exact candidate archive
        run: |
          candidate="$RUNNER_TEMP/candidate/php${PHP_VERSION}-cache.tar.zst"
          test -f "$candidate"
          zstd -dc "$candidate" | sudo tar -xf - -C /
          echo /opt/local/bin >> "$GITHUB_PATH"

      - name: Validate natively on Intel
        run: |
          test "$(uname -m)" = "x86_64"
          file "$(command -v php)" | grep -q x86_64
          php -v
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message on Intel" >&2
            exit 1
          fi
          sudo /opt/local/sbin/php-fpm"$PHP_VERSION" -t
          php -r '$image = imagecreatetruecolor(2, 2); if ($image === false) { throw new Exception("GD failed"); }'
          php -r 'if (gmp_strval(gmp_add("2", "3")) !== "5") { throw new Exception("GMP failed"); }'
          php -r '$db = new SQLite3(":memory:"); if ($db->querySingle("SELECT 2 + 3") !== 5) { throw new Exception("SQLite failed"); }'
          php -r '$file = tempnam(sys_get_temp_dir(), "zip"); unlink($file); $zip = new ZipArchive(); if ($zip->open($file, ZipArchive::CREATE) !== true || !$zip->addFromString("test", "ok") || !$zip->close()) { throw new Exception("ZIP failed"); } unlink($file);'
          php -r '$xml = new DOMDocument(); $xml->loadXML("<root/>"); $style = new DOMDocument(); $style->loadXML("<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"><xsl:template match=\"/\"><ok/></xsl:template></xsl:stylesheet>"); $xsl = new XSLTProcessor(); $xsl->importStylesheet($style); if (strpos($xsl->transformToXML($xml), "<ok/>") === false) { throw new Exception("XSL failed"); }'
          php -r 'if (extension_loaded("yaml")) { $parsed = yaml_parse("key: value"); if ($parsed["key"] !== "value") { throw new Exception("YAML failed"); } }'
          php -r '$curl = curl_init("https://repo.packagist.org/packages.json"); curl_setopt($curl, CURLOPT_RETURNTRANSFER, true); $body = curl_exec($curl); if ($body === false || curl_getinfo($curl, CURLINFO_HTTP_CODE) !== 200) { throw new Exception(curl_error($curl)); }'
          AUDIT_DIR="$RUNNER_TEMP/intel-audit/base" bash scripts/audit-dependencies.sh

      - name: Validate published Imagick cache natively on Intel
        run: |
          bash scripts/install.sh "$PHP_VERSION" imagick
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message after installing Imagick on Intel" >&2
            exit 1
          fi
          php -r 'if (!extension_loaded("imagick")) { throw new Exception("imagick not loaded"); }'
          imagick_path="$(php -r 'echo ini_get("extension_dir") . "/imagick.so";')"
          test -f "$imagick_path"
          file -L "$imagick_path" | grep -q x86_64
          file -L /opt/local/bin/convert | grep -q x86_64
          php -r '$formats = Imagick::queryFormats("HEI*"); if (!in_array("HEIC", $formats, true) && !in_array("HEIF", $formats, true)) { throw new Exception("HEIC/HEIF support not found"); }'
          /opt/local/bin/convert -list format | grep -Eq '^[[:space:]]*HEI(C|F)'
          AUDIT_DIR="$RUNNER_TEMP/intel-audit/imagick" bash scripts/audit-dependencies.sh

      - name: Validate packaged PECL build tools natively on Intel
        run: |
          /opt/local/bin/autoconf --version | grep -q '2\.69'
          curl -fsSL --retry 3 -o /tmp/msgpack-0.5.7.tgz https://pecl.php.net/get/msgpack-0.5.7.tgz
          sudo env PATH="/opt/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            /opt/local/bin/pecl install /tmp/msgpack-0.5.7.tgz
          extension_dir="$(php -r 'echo ini_get("extension_dir");')"
          php -d "extension=$extension_dir/msgpack.so" -r 'if (!extension_loaded("msgpack")) { throw new Exception("msgpack not loaded"); }'
          file -L "$extension_dir/msgpack.so" | grep -q x86_64
          AUDIT_DIR="$RUNNER_TEMP/intel-audit/pecl" bash scripts/audit-dependencies.sh

      - name: Upload Intel compatibility audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: php${{ env.PHP_VERSION }}-audit-intel
          path: ${{ runner.temp }}/intel-audit
          if-no-files-found: error
          retention-days: 14

      - name: Restore runner state
        if: ${{ always() }}
        run: |
          backup="/opt/local.before-intel-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PHP_VERSION}"
          state="$RUNNER_TEMP/opt-local-intel-state"
          [[ -f "$state" ]] || exit 0
          sudo rm -rf /opt/local
          if [[ "$(cat "$state")" == "present" ]]; then
            test -e "$backup"
            sudo mv "$backup" /opt/local
          fi

  publish:
    name: Publish caches
    if: ${{ inputs.publish }}
    needs: [build, intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download candidate caches
        uses: actions/download-artifact@v8
        with:
          pattern: php*-cache-arm64
          path: ${{ runner.temp }}/builds
          merge-multiple: true

      - name: Verify candidate set
        run: |
          test "$(find "$RUNNER_TEMP/builds" -maxdepth 1 -name 'php5[3-5]-cache.tar.zst' | wc -l)" -eq 3
          sha256sum "$RUNNER_TEMP"/builds/*.tar.zst

      - name: Back up published caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          gh release download builds --repo "$GITHUB_REPOSITORY" --pattern 'php5[3-5]-cache.tar.zst' --dir "$RUNNER_TEMP/backup"

      - name: Upload cache backup
        uses: actions/upload-artifact@v7
        with:
          name: php-cache-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Install Cloudsmith CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/cloudsmith"
          "$RUNNER_TEMP/cloudsmith/bin/pip" install --upgrade pip cloudsmith-cli
          echo "$RUNNER_TEMP/cloudsmith/bin" >> "$GITHUB_PATH"

      - name: Publish caches
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in "$RUNNER_TEMP"/builds/*.tar.zst; do
            name="$(basename "$asset")"
            cloudsmith push raw "$GITHUB_REPOSITORY" "$asset" --republish --summary "$name" --description "$name"
          done
          gh release upload builds --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/builds/*.tar.zst --clobber

      - name: Verify published GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          for asset in "$RUNNER_TEMP"/builds/*.tar.zst; do
            name="$(basename "$asset")"
            gh release download builds --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/published"
            test "$(sha256sum "$asset" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/published/$name" | cut -d' ' -f1)"
          done
