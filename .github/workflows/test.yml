name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  run:
    name: PHP ${{ matrix.php-versions }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['5.3', '5.4', '5.5']
        runner: [macos-15, macos-15-intel]
    env:
      PHP_VERSION: ${{ matrix.php-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check isolated runner
        run: |
          case "${{ matrix.runner }}" in
            macos-15)
              test "$(uname -m)" = "arm64"
              /usr/bin/arch -x86_64 /usr/bin/true
              ;;
            macos-15-intel)
              test "$(uname -m)" = "x86_64"
              ;;
          esac
          test ! -e /opt/local
          zstd --version

      - name: Setup PHP
        run: bash scripts/install.sh "${PHP_VERSION/./}"

      - name: Test PHP and extensions
        run: |
          php --ini
          php -v
          phpize --version
          php-config --version
          php -r "if (strpos(phpversion(), '$PHP_VERSION') === false) { throw new Exception('Wrong PHP version installed'); }"
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message" >&2
            exit 1
          fi
          sudo /opt/local/sbin/php-fpm"${PHP_VERSION/./}" -t
          ext_dir="$(php -i | sed -n 's|^extension_dir => \(/.*\) =>.*|\1|p' | head -1)"
          for bin in "$ext_dir"/*.so; do
            extension="$(basename "$bin" .so)"
            case "$extension" in
              opcache) extension='Zend OPcache' ;;
              xdebug) continue ;;
            esac
            php -r "if (!extension_loaded('$extension')) { throw new Exception('$extension not loaded'); }"
          done
          php -r "if (!extension_loaded('Zend OPcache')) { throw new Exception('Zend OPcache not found'); }"
          bash scripts/audit-dependencies.sh

      - name: Install and test Imagick
        run: |
          bash scripts/install.sh "${PHP_VERSION/./}" imagick
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message after installing Imagick" >&2
            exit 1
          fi
          php -r "if (!extension_loaded('imagick')) { throw new Exception('imagick not found'); }"
          imagick_path="$(php -r 'echo ini_get("extension_dir") . "/imagick.so";')"
          test -f "$imagick_path"
          file -L "$imagick_path" | grep -q x86_64
          file -L /opt/local/bin/convert | grep -q x86_64
          php -r '$formats = Imagick::queryFormats("HEI*"); if (!in_array("HEIC", $formats, true) && !in_array("HEIF", $formats, true)) { throw new Exception("HEIC/HEIF support not found"); }'
          /opt/local/bin/convert -list format | grep -Eq '^[[:space:]]*HEI(C|F)'
          bash scripts/audit-dependencies.sh

      - name: Test SSL in file_get_contents
        run: php -r "echo file_get_contents('https://repo.packagist.org/packages.json');"

      - name: Test PECL
        run: |
          test "$(command -v autoconf)" = /usr/local/bin/autoconf
          test "$(readlink /usr/local/bin/autoconf)" = /opt/local/bin/autoconf
          autoconf --version | grep -q '2\.69'
          pecl -V
          curl -fsSL --retry 3 -o /tmp/msgpack-0.5.7.tgz https://pecl.php.net/get/msgpack-0.5.7.tgz
          sudo pecl install /tmp/msgpack-0.5.7.tgz
          php -r "if (!extension_loaded('msgpack')) { throw new Exception('msgpack not found'); }"
          extension_dir="$(php -r 'echo ini_get("extension_dir");')"
          file -L "$extension_dir/msgpack.so" | grep -q x86_64

  upload:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install cloudsmith-cli
        run: |
          pip install --upgrade cloudsmith-cli
          sudo cp ./scripts/cds /usr/local/bin/cds
          sudo sed -i "s|REPO|${{ github.repository }}|" /usr/local/bin/cds
          sudo chmod a+x /usr/local/bin/cds
      - name: Update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          release=builds
          if ! gh release view "$release"; then
            gh release create "$release" scripts/install.sh -t "$release" -n "$release"
          else
            gh release upload "$release" scripts/install.sh --clobber
          fi
          cds ./scripts/install.sh
