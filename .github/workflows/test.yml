name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  run:
    name: PHP ${{ matrix.php-versions }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['5.3', '5.4', '5.5']
        runner: [macos-14, macos-15-intel]
    env:
      PHP_VERSION: ${{ matrix.php-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test PECL command options
        run: bash scripts/tests/test-pecl-options.sh

      - name: Check isolated runner
        run: |
          case "${{ matrix.runner }}" in
            macos-14)
              test "$(uname -m)" = "arm64"
              ;;
            macos-15-intel)
              test "$(uname -m)" = "x86_64"
              ;;
          esac
          echo "EXPECTED_ARCHITECTURE=$(uname -m)" >> "$GITHUB_ENV"
          backup="$RUNNER_TEMP/opt-local.preinstalled"
          state="$RUNNER_TEMP/opt-local-state"
          test ! -e "$backup"
          if [[ -d /opt/local ]]; then
            sudo mv /opt/local "$backup"
            echo present > "$state"
          else
            echo absent > "$state"
          fi
          command -v zstd || brew install zstd
          echo /usr/local/bin >> "$GITHUB_PATH"

      - name: Setup PHP
        id: install
        run: bash scripts/install.sh "${PHP_VERSION/./}"

      - name: Test PHP and extensions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bash scripts/validate-extensions.sh "${PHP_VERSION/./}"
          php --ini
          php -v
          phpize --version
          php-config --version
          php -r "if (strpos(phpversion(), '$PHP_VERSION') === false) { throw new Exception('Wrong PHP version installed'); }"
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message" >&2
            exit 1
          fi
          sudo /opt/local/sbin/php-fpm"${PHP_VERSION/./}" -t
          ext_dir="$(php -i | sed -n 's|^extension_dir => \(/.*\) =>.*|\1|p' | head -1)"
          for bin in "$ext_dir"/*.so; do
            extension="$(basename "$bin" .so)"
            case "$extension" in
              opcache) extension='Zend OPcache' ;;
              xdebug) continue ;;
            esac
            php -r "if (!extension_loaded('$extension')) { throw new Exception('$extension not loaded'); }"
          done
          php -r "if (!extension_loaded('Zend OPcache')) { throw new Exception('Zend OPcache not found'); }"
          bash scripts/audit-dependencies.sh /opt/local "$EXPECTED_ARCHITECTURE"

      - name: Install and test Imagick
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bash scripts/install.sh "${PHP_VERSION/./}" imagick
          modules="$(php -m 2>&1)"
          printf '%s\n' "$modules"
          if grep -Eq '^PHP (Warning|Startup|Deprecated|Notice)' <<< "$modules"; then
            echo "PHP emitted a startup message after installing Imagick" >&2
            exit 1
          fi
          php -r "if (!extension_loaded('imagick')) { throw new Exception('imagick not found'); }"
          imagick_path="$(php -r 'echo ini_get("extension_dir") . "/imagick.so";')"
          test -f "$imagick_path"
          file -L "$imagick_path" | grep "$EXPECTED_ARCHITECTURE"
          # shellcheck disable=SC2016
          php -r '$image = new Imagick(); $image->newImage(2, 2, "white"); if ($image->getImageWidth() !== 2) { throw new Exception("Imagick failed"); }'
          # shellcheck disable=SC2016
          php -r '$formats = Imagick::queryFormats("HEI*"); if (!in_array("HEIC", $formats, true) && !in_array("HEIF", $formats, true)) { throw new Exception("HEIC/HEIF support not found"); }'
          bash scripts/audit-dependencies.sh /opt/local "$EXPECTED_ARCHITECTURE"

      - name: Test SSL in file_get_contents
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: php -r 'if (file_get_contents("https://repo.packagist.org/packages.json") === false) { throw new Exception("HTTPS stream failed"); }'

      - name: Test PECL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          test "$(command -v autoconf)" = /usr/local/bin/autoconf
          test "$(readlink /usr/local/bin/autoconf)" = /opt/local/bin/autoconf
          # Read the full output: grep -q can give Autoconf SIGPIPE with pipefail.
          autoconf --version | grep '2\.69'
          bash scripts/validate-pecl.sh "${PHP_VERSION/./}"

      - name: Restore runner state
        if: ${{ always() }}
        run: |
          state="$RUNNER_TEMP/opt-local-state"
          [[ -f "$state" ]] || exit 0
          if [[ "$(cat "$state")" = present ]]; then
            test -d "$RUNNER_TEMP/opt-local.preinstalled"
          fi
          sudo rm -rf /opt/local
          if [[ "$(cat "$state")" = present ]]; then
            sudo mv "$RUNNER_TEMP/opt-local.preinstalled" /opt/local
          fi
